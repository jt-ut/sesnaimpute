# --- Broad-line AGN -------------------------------------------------------
# Fires on (AGN1 & AGN2 & AGN3) & (AGN4 | AGN5 | AGN6).  The disjunction is
# expressed as three terms in terms.toml, each carrying AGN1-3 plus one of
# AGN4-6.  This is the only OR inside a single class in the scheme.

[[row]]
id        = "AGN1"
gate      = "P1_AGN"
panel     = "agn_cmd"
published = "[4.5]-[8.0] > 0.5"
coef      = { E = "1" }
sense     = ">"
t         = "0.5"

[[row]]
id        = "AGN2"
gate      = "P1_AGN"
panel     = "agn_cmd"
published = "[4.5] > 13.5 + ([4.5]-[8.0]-2.3)/0.4"
coef      = { m45 = "1", E = "-(1/0.4)" }
sense     = ">"
t         = "13.5 - 2.3/0.4"

[[row]]
id        = "AGN3"
gate      = "P1_AGN"
panel     = "agn_cmd"
published = "[4.5] > 13.5"
coef      = { m45 = "1" }
sense     = ">"
t         = "13.5"

[[row]]
id        = "AGN4"
gate      = "P1_AGN"
panel     = "agn_cmd"
published = "[4.5] > 14 + ([4.5]-[8.0]-0.5)"
coef      = { m45 = "1", E = "-1" }
sense     = ">"
t         = "14 - 0.5"

[[row]]
id        = "AGN5"
gate      = "P1_AGN"
panel     = "agn_cmd"
published = "[4.5] > 14.5 - ([4.5]-[8.0]-1.2)/0.3"
coef      = { m45 = "1", E = "1/0.3" }
sense     = ">"
t         = "14.5 + 1.2/0.3"

[[row]]
id        = "AGN6"
gate      = "P1_AGN"
panel     = "agn_cmd"
published = "[4.5] > 14.5"
coef      = { m45 = "1" }
sense     = ">"
t         = "14.5"

# --- Unresolved shock-emission knots --------------------------------------

[[row]]
id        = "SHK1"
gate      = "P1_SHOCK"
term      = "T_SHOCK"
panel     = "irac_ccd_1"
published = "[3.6]-[4.5] > (1.2/0.55)*(([4.5]-[5.8])-0.3) + 0.8"
coef      = { A = "1", B = "-(1.2/0.55)" }
sense     = ">"
t         = "(1.2/0.55)*(-0.3) + 0.8"

[[row]]
id        = "SHK2"
gate      = "P1_SHOCK"
term      = "T_SHOCK"
panel     = "irac_ccd_1"
published = "[4.5]-[5.8] <= 0.85"
coef      = { B = "1" }
sense     = "<="
t         = "0.85"

[[row]]
id        = "SHK3"
gate      = "P1_SHOCK"
term      = "T_SHOCK"
panel     = "irac_ccd_1"
published = "[3.6]-[4.5] > 1.05"
coef      = { A = "1" }
sense     = ">"
t         = "1.05"

# --- PAH-contaminated apertures -------------------------------------------
# sigma_4 = sigma{[4.5]-[5.8]} = sB;  sigma_5 = sigma{[3.6]-[4.5]} = sA.
# The sigma signs make flagging EASIER as uncertainty grows — the cut is
# deliberately biased toward purity of the YSO list.  Preserved as published.

[[row]]
id        = "PAP1"
gate      = "P1_PAHAP"
term      = "T_PAHAP"
panel     = "irac_ccd_1"
published = "[3.6]-[4.5] - s5 <= 1.4*(([4.5]-[5.8]) + s4 - 0.7) + 0.15"
coef      = { A = "1", B = "-1.4" }
ksigma    = { sA = "-1", sB = "-1.4" }
sense     = "<="
t         = "1.4*(-0.7) + 0.15"

[[row]]
id        = "PAP2"
gate      = "P1_PAHAP"
term      = "T_PAHAP"
panel     = "irac_ccd_1"
published = "[3.6]-[4.5] - s5 <= 1.65"
coef      = { A = "1" }
ksigma    = { sA = "-1" }
sense     = "<="
t         = "1.65"

# --- Class I protostars ---------------------------------------------------
# No sigma terms in the arXiv source.  The published version's
# "s3 = sigma{[4.5]-[5.8]} > 0.7" is a typesetting artefact of merged
# definition and constraint lines (erratum E12).

[[row]]
id        = "C1_1"
gate      = "P1_CLASS_I"
term      = "T_C1"
panel     = "irac_ccd_1"
published = "[4.5]-[5.8] > 0.7"
coef      = { B = "1" }
sense     = ">"
t         = "0.7"

[[row]]
id        = "C1_2"
gate      = "P1_CLASS_I"
term      = "T_C1"
panel     = "irac_ccd_1"
published = "[3.6]-[4.5] > 0.7"
coef      = { A = "1" }
sense     = ">"
t         = "0.7"

# --- Class II YSOs --------------------------------------------------------
# Bare `sigma` in the appendix, bound per-term to the sigma of the colour
# appearing in that term (erratum E3, SIGMA_BINDING = "per_colour").

[[row]]
id        = "C2_1"
gate      = "P1_CLASS_II"
term      = "T_C2"
panel     = "irac_ccd_2"
published = "[4.5]-[8.0] - s > 0.5"
coef      = { E = "1" }
ksigma    = { sE = "-1" }
sense     = ">"
t         = "0.5"

[[row]]
id        = "C2_2"
gate      = "P1_CLASS_II"
term      = "T_C2"
panel     = "irac_ccd_2"
published = "[3.6]-[5.8] - s > 0.35"
coef      = { D = "1" }
ksigma    = { sD = "-1" }
sense     = ">"
t         = "0.35"

[[row]]
id        = "C2_3"
gate      = "P1_CLASS_II"
term      = "T_C2"
panel     = "irac_ccd_2"
published = "[3.6]-[5.8] + s <= (0.14/0.04)*(([4.5]-[8.0] - s) - 0.5) + 0.5"
coef      = { D = "1", E = "-(0.14/0.04)" }
ksigma    = { sD = "1", sE = "0.14/0.04" }
sense     = "<="
t         = "(0.14/0.04)*(-0.5) + 0.5"

[[row]]
id        = "C2_4"
gate      = "P1_CLASS_II"
term      = "T_C2"
panel     = "irac_ccd_2"
published = "[3.6]-[4.5] - s > 0.15"
coef      = { A = "1" }
ksigma    = { sA = "-1" }
sense     = ">"
t         = "0.15"

# ==========================================================================
# PHASE 2 — JHKs + [3.6][4.5], in dereddened colours
# ==========================================================================
# sigma_1 = sigma{[[3.6]-[4.5]]_meas} = sA
# sigma_2 = sigma{[Ks-[3.6]]_meas}    = sY
# Both are uncertainties on the MEASURED colours, not the dereddened ones.
#
# The printed decimal 2.85714 is used, not 20/7 — the published scheme is the
# decimal, and the 1.4e-5 slope difference is not ours to correct.

[[row]]
id        = "P2_YSO1"
gate      = "P2_YSO"
term      = "T_P2_YSO"
panel     = "k12_ccd"
published = "[[3.6]-[4.5]]_0 - s1 > 0.101"
coef      = { X0 = "1" }
ksigma    = { sA = "-1" }
sense     = ">"
t         = "0.101"

[[row]]
id        = "P2_YSO2"
gate      = "P2_YSO"
term      = "T_P2_YSO"
panel     = "k12_ccd"
published = "[Ks-[3.6]]_0 - s2 > 0"
coef      = { Y0 = "1" }
ksigma    = { sY = "-1" }
sense     = ">"
t         = "0"

[[row]]
id        = "P2_YSO3"
gate      = "P2_YSO"
term      = "T_P2_YSO"
panel     = "k12_ccd"
published = "[Ks-[3.6]]_0 - s2 > -2.85714*([[3.6]-[4.5]]_0 - s1 - 0.101) + 0.5"
coef      = { Y0 = "1", X0 = "2.85714" }
ksigma    = { sY = "-1", sA = "-2.85714" }
sense     = ">"
t         = "0.5 + 2.85714*0.101"

[[row]]
id        = "P2_PROTO"
gate      = "P2_PROTO"
term      = "T_P2_PROTO"
panel     = "k12_ccd"
published = "[Ks-[3.6]]_0 - s2 > -2.85714*([[3.6]-[4.5]]_0 - s1 - 0.401) + 1.7"
coef      = { Y0 = "1", X0 = "2.85714" }
ksigma    = { sY = "-1", sA = "-2.85714" }
sense     = ">"
t         = "1.7 + 2.85714*0.401"

[[row]]
id        = "P2_BRT_II"
gate      = "P2_CLASS_II"
term      = "T_P2_C2"
panel     = "k12_ccd"
published = "[3.6]_0 < 14.5"
coef      = { m36_0 = "1" }
sense     = "<"
t         = "14.5"

[[row]]
id        = "P2_BRT_I"
gate      = "P2_PROTO"
term      = "T_P2_PROTO"
panel     = "k12_ccd"
published = "[3.6]_0 < 15"
coef      = { m36_0 = "1" }
sense     = "<"
t         = "15"

