#
# Gutermuth+2009 (ApJS 184, 18) Appendix A — boundary table
#
# 45 rows.  Each row is one published constraint, normalised to
#
#       ( w · f  +  k · sigma )   SENSE   t
#
# where `w` is a linear combination over colours/magnitudes (§features),
# `k` a linear combination over propagated colour uncertainties (§sigmas),
# and SENSE one of  >  <  >=  <=   (strictness is per-row and load-bearing).
#
# `coef` and `t` are stored as EXPRESSION STRINGS, evaluated at load.  Do not
# replace them with rounded decimals: 1.05/1.2 and 1.4*(-0.7)+0.15 do not land
# on exact binary, and rounding introduces a permanent silent offset.
#
# `published` reproduces the appendix equation verbatim and is what the
# transcription test (T1) checks each normalised row against.
#
schema_version = 1

# --------------------------------------------------------------------------
# Feature basis
# --------------------------------------------------------------------------
# Colours and magnitudes, defined as linear combinations of the eight band
# magnitudes.  D = A+B and E = B+C are redundant; they are kept so the table
# diffs line-by-line against the appendix.

[features]
A     = { mags = { I1 =  1, I2 = -1 }, label = "[3.6]-[4.5]" }
B     = { mags = { I2 =  1, I3 = -1 }, label = "[4.5]-[5.8]" }
C     = { mags = { I3 =  1, I4 = -1 }, label = "[5.8]-[8.0]" }
D     = { mags = { I1 =  1, I3 = -1 }, label = "[3.6]-[5.8]" }
E     = { mags = { I2 =  1, I4 = -1 }, label = "[4.5]-[8.0]" }
F     = { mags = { I1 =  1, M1 = -1 }, label = "[3.6]-[24]"  }
G     = { mags = { I2 =  1, M1 = -1 }, label = "[4.5]-[24]"  }
H     = { mags = { I3 =  1, M1 = -1 }, label = "[5.8]-[24]"  }
I     = { mags = { I4 =  1, M1 = -1 }, label = "[8.0]-[24]"  }
m36   = { mags = { I1 =  1 },          label = "[3.6]"       }
m45   = { mags = { I2 =  1 },          label = "[4.5]"       }
m24   = { mags = { M1 =  1 },          label = "[24]"        }

# Dereddened quantities.  Piecewise-linear in the band magnitudes: affine
# within a dereddening branch, with the branch chosen by featurize.py.  Not
# expressible as a fixed `mags` dict, hence kind = "derived".
X0    = { kind = "derived", label = "[[3.6]-[4.5]]_0" }
Y0    = { kind = "derived", label = "[Ks-[3.6]]_0"    }
m36_0 = { kind = "derived", label = "[3.6]_0"         }

# Propagated colour uncertainties: quadrature over the constituent bands.
[sigmas]
sA = { bands = ["I1", "I2"], of = "A" }
sB = { bands = ["I2", "I3"], of = "B" }
sC = { bands = ["I3", "I4"], of = "C" }
sD = { bands = ["I1", "I3"], of = "D" }
sE = { bands = ["I2", "I4"], of = "E" }
sY = { bands = ["Ks", "I1"], of = "Ks-[3.6]" }

# Display planes, referenced by rows for plotting.  Axis inversion is stored
# because m45 runs 18 -> 3 in the AGN colour-magnitude diagram.
[panels]
pah_ccd_a  = { x = "C",  y = "B",  xlim = [-1.0,  3.0], ylim = [-1.0, 3.0] }
pah_ccd_b  = { x = "E",  y = "D",  xlim = [-1.0,  4.0], ylim = [-1.0, 3.0] }
agn_cmd    = { x = "E",  y = "m45", xlim = [-1.0, 4.0], ylim = [18.0, 3.0], y_invert = true }
irac_ccd_1 = { x = "B",  y = "A",  xlim = [-1.0,  3.0], ylim = [-1.0, 3.2] }
irac_ccd_2 = { x = "E",  y = "D",  xlim = [-1.0,  4.0], ylim = [-1.0, 3.0] }
k12_ccd    = { x = "X0", y = "Y0", xlim = [-0.5,  2.0], ylim = [-0.5, 3.0] }
mips_ccd   = { x = "G",  y = "D",  xlim = [-1.0, 10.0], ylim = [-1.0, 3.0] }

# Phase 3 has no single plane: every criterion pairs a 24 um colour with a
# brightness cut, and which IRAC band supplies the colour is chosen per source
# by the detection mask.  So each Phase-3 term gets its own colour-magnitude
# plane, which is what makes it drawable at all.  Display metadata only --
# nothing in the cascade reads these.
td_cmd_58  = { x = "H",  y = "m36", xlim = [-1.0,  8.0], ylim = [18.0, 6.0], y_invert = true }
td_cmd_45  = { x = "G",  y = "m36", xlim = [-1.0,  8.0], ylim = [18.0, 6.0], y_invert = true }
emb_cmd_36 = { x = "F",  y = "m24", xlim = [-1.0, 10.0], ylim = [14.0, 0.0], y_invert = true }
emb_cmd_45 = { x = "G",  y = "m24", xlim = [-1.0, 10.0], ylim = [14.0, 0.0], y_invert = true }
emb_cmd_58 = { x = "H",  y = "m24", xlim = [-1.0, 10.0], ylim = [14.0, 0.0], y_invert = true }
emb_cmd_80 = { x = "I",  y = "m24", xlim = [-1.0, 10.0], ylim = [14.0, 0.0], y_invert = true }

# ==========================================================================
# PHASE 1 — IRAC four-band
# ==========================================================================

# --- PAH-emitting galaxies, rule set A ------------------------------------

[[row]]
id        = "PAH_A1"
gate      = "P1_PAH"
term      = "T_PAH_A"
panel     = "pah_ccd_a"
published = "[4.5]-[5.8] < (1.05/1.2)*([5.8]-[8.0]-1)"
coef      = { B = "1", C = "-(1.05/1.2)" }
sense     = "<"
t         = "-(1.05/1.2)"

[[row]]
id        = "PAH_A2"
gate      = "P1_PAH"
term      = "T_PAH_A"
panel     = "pah_ccd_a"
published = "[4.5]-[5.8] < 1.05"
coef      = { B = "1" }
sense     = "<"
t         = "1.05"

[[row]]
id        = "PAH_A3"
gate      = "P1_PAH"
term      = "T_PAH_A"
panel     = "pah_ccd_a"
